format='''\[ $os$shell\] $username$all$character'''

[aws]
symbol = "  "

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰁽 "
empty_symbol = "󰂎 "
disabled = false
format = "[$symbol$percentage]($style) "

[[battery.display]]
threshold = 30
style = "red bold"

[buf]
symbol = " "

[c]
symbol = " "

[character]
format = "$symbol "
success_symbol = "[->](bold green)"
error_symbol = "[->](bold red)"
vimcmd_symbol = "[<-](bold green)"
vimcmd_visual_symbol = "[<-](bold yellow)"
vimcmd_replace_symbol = "[<-](bold purple)"
vimcmd_replace_one_symbol = "[<-](bold purple)"
disabled = false

